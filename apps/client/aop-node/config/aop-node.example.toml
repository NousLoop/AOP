gateway_url = "http://127.0.0.1:8080"
orchestrator_url = "http://127.0.0.1:8090"
# Leave empty when Gateway AUTH_REQUIRED=false. A non-empty key requires Postgres for validation.
api_key = ""
node_id = "node-local-1"
plugins_dir = "./plugins"
versions_dir = "~/.aop/node/versions"
log_dir = "~/.aop/node/logs"
heartbeat_interval_secs = 30
mgmt_listen = "127.0.0.1:7920"
# All kind=cli harnesses share this port: /agents/<plugin-id>/
cli_a2a_listen = "127.0.0.1:8020"
register_endpoint = "http://127.0.0.1:7920/"
# Mgmt URL only. aopd does not register this as an A2A agent.
update_manifest_url = ""
autostart = true

# Optional: if plugins are copied outside the monorepo, point at the AOP root
# (also settable as process env AOP_REPO_ROOT).
# AOP_REPO_ROOT is read by plugins/_harness/launch.py, not by aopd itself.

# Optional inline agents (in addition to plugins/*/plugin.toml)
# Prefer plugins/<id>/plugin.toml with kind=cli (manufacturer command).

[whitelist]
allowed_binaries = [
  "python",
  "python3",
  "openclaw",
  "hermes",
  "pi",
  "claude",
  "dsh",
  "cmd",
  "sh",
]
allowed_plugin_ids = [
  "claude-code",
  "deepseek-harness",
  "pi",
  "openclaw",
  "hermes",
  "echo",
]
allowed_path_prefixes = []

id = "claude-code"
version = "0.1.0"
kind = "cli"
command = "claude"
args = []
workdir = "."
description = "aopd Claude Code — shared A2A port /agents/claude-code; tasks spawn manufacturer claude CLI"

[env]
HARNESS_PROFILE = "claude-code"
AGENT_ID = "aopd-claude-code"
AGENT_DISPLAY_NAME = "aopd Claude Code"
HARNESS_RUNNER = "claude_cli"
# Optional: CLAUDE_CLI_PATH=/path/to/claude

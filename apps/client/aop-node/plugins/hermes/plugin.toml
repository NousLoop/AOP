id = "hermes"
version = "0.1.0"
kind = "cli"
command = "hermes"
args = []
workdir = "."
description = "aopd Hermes — shared A2A port /agents/hermes; tasks spawn manufacturer hermes CLI"

[env]
HARNESS_PROFILE = "hermes"
AGENT_ID = "aopd-hermes"
AGENT_DISPLAY_NAME = "aopd Hermes"
HARNESS_RUNNER = "hermes"
# Optional: HERMES_CLI_PATH=/path/to/hermes

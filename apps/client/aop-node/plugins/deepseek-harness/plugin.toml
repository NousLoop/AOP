id = "deepseek-harness"
version = "0.1.0"
kind = "agent"
command = "python"
args = ["-u", "../_harness/run_profile.py"]
workdir = "."
health_url = "http://127.0.0.1:8022/health"
description = "aopd DeepSeek Harness (plugin → agents/harness-agent)"

[env]
PORT = "8022"
AGENT_URL = "http://127.0.0.1:8022/"
HARNESS_PROFILE = "deepseek-harness"
AGENT_ID = "aopd-deepseek-harness"
AGENT_DISPLAY_NAME = "aopd DeepSeek Harness"
AOP_NODE_MANAGED = "1"
HARNESS_HEARTBEAT = "0"
HARNESS_RUNNER = "deepseek"

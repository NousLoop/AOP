id = "deepseek-harness"
version = "0.1.0"
kind = "cli"
command = "dsh"
args = []
workdir = "."
description = "aopd DeepSeek Harness — shared A2A port /agents/deepseek-harness; tasks spawn manufacturer dsh CLI"

[env]
HARNESS_PROFILE = "deepseek-harness"
AGENT_ID = "aopd-deepseek-harness"
AGENT_DISPLAY_NAME = "aopd DeepSeek Harness"
HARNESS_RUNNER = "deepseek"
# Optional: DSH_CLI_PATH=/path/to/dsh  DSH_HOME=~/.aop/dsh-home

id = "pi"
version = "0.1.0"
kind = "cli"
command = "pi"
args = []
workdir = "."
description = "aopd Pi — shared A2A port /agents/pi; tasks spawn manufacturer pi CLI"

[env]
HARNESS_PROFILE = "pi"
AGENT_ID = "aopd-pi"
AGENT_DISPLAY_NAME = "aopd Pi"
HARNESS_RUNNER = "pi_cli"
# Optional: PI_CLI_PATH=/path/to/pi

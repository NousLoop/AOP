id = "openclaw"
version = "0.1.0"
kind = "cli"
command = "openclaw"
args = []
workdir = "."
description = "aopd OpenClaw — shared A2A port /agents/openclaw; tasks spawn manufacturer openclaw CLI"

[env]
HARNESS_PROFILE = "openclaw"
AGENT_ID = "aopd-openclaw"
AGENT_DISPLAY_NAME = "aopd OpenClaw"
HARNESS_RUNNER = "openclaw"
# Optional: OPENCLAW_CLI_PATH=/path/to/openclaw

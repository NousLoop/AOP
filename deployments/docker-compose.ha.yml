# High Availability Deployment Configuration
# 使用此配置进行生产环境的高可用部署

services:
  # Orchestrator Multiple Instances
  orchestrator-1:
    build:
      context: ../apps/orchestrator
      dockerfile: Dockerfile
    container_name: aop-orchestrator-1
    environment:
      - DATABASE_URL=postgresql://aop:aop@postgres:5432/aop
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aopminio
      - MINIO_SECRET_KEY=aopminio123
      - ORCHESTRATOR_ID=orchestrator-1
      - ORCHESTRATOR_PORT=8090
      - METRICS_PORT=9091
    ports:
      - "8090:8090"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  orchestrator-2:
    build:
      context: ../apps/orchestrator
      dockerfile: Dockerfile
    container_name: aop-orchestrator-2
    environment:
      - DATABASE_URL=postgresql://aop:aop@postgres:5432/aop
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aopminio
      - MINIO_SECRET_KEY=aopminio123
      - ORCHESTRATOR_ID=orchestrator-2
      - ORCHESTRATOR_PORT=8091
      - METRICS_PORT=9191
    ports:
      - "8091:8091"
      - "9191:9191"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  orchestrator-3:
    build:
      context: ../apps/orchestrator
      dockerfile: Dockerfile
    container_name: aop-orchestrator-3
    environment:
      - DATABASE_URL=postgresql://aop:aop@postgres:5432/aop
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aopminio
      - MINIO_SECRET_KEY=aopminio123
      - ORCHESTRATOR_ID=orchestrator-3
      - ORCHESTRATOR_PORT=8092
      - METRICS_PORT=9291
    ports:
      - "8092:8092"
      - "9291:9291"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Gateway with Load Balancing
  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    container_name: aop-gateway
    environment:
      - DATABASE_URL=postgresql://aop:aop@postgres:5432/aop
      - REDIS_URL=redis://redis:6379/0
      - ORCHESTRATOR_URLS=http://orchestrator-1:8090,http://orchestrator-2:8091,http://orchestrator-3:8092
      - AUTH_REQUIRED=true
      - SEED_DEV_KEY=true
      - DEFAULT_TENANT_ID=00000000-0000-0000-0000-000000000001
    ports:
      - "8080:8080"
    depends_on:
      - orchestrator-1
      - orchestrator-2
      - orchestrator-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Load Balancer (Nginx)
  nginx-lb:
    image: nginx:alpine
    container_name: aop-nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - orchestrator-1
      - orchestrator-2
      - orchestrator-3
    restart: unless-stopped

  # Infrastructure Services
  postgres:
    image: postgres:16-alpine
    container_name: aop-postgres
    environment:
      POSTGRES_USER: aop
      POSTGRES_PASSWORD: aop
      POSTGRES_DB: aop
    ports:
      - "5432:5432"
    volumes:
      - aop_pg_data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aop -d aop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aop-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - aop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aopminio
      MINIO_ROOT_PASSWORD: aopminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aop_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: aop-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 aopminio aopminio123;
      mc mb -p local/aop-artifacts || true;
      mc anonymous set download local/aop-artifacts || true;
      exit 0;
      "

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: aop-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.ha.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - aop_prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aop-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - aop_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aop-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - aop_alertmanager_data:/alertmanager
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  aop_pg_data:
  aop_redis_data:
  aop_minio_data:
  aop_prometheus_data:
  aop_grafana_data:
  aop_alertmanager_data:
name: CD Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      next_public_api_base:
        description: "NEXT_PUBLIC_API_BASE baked into the web image"
        required: false
        default: "http://127.0.0.1:8080"

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: .
            dockerfile: apps/gateway/Dockerfile
          - image: orchestrator
            context: .
            dockerfile: apps/orchestrator/Dockerfile
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: harness-agent
            context: .
            dockerfile: agents/harness-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            NEXT_PUBLIC_API_BASE=${{ github.event.inputs.next_public_api_base || 'http://127.0.0.1:8080' }}
            NPM_REGISTRY=https://registry.npmjs.org/
            PIP_INDEX_URL=https://pypi.org/simple
